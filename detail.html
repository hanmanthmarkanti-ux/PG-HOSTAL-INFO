<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Hostel Details</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background: #f8fafc; }
        .detail-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 24px; background: var(--gradient); color: white;
            text-decoration: none; border-radius: 12px; font-size: 0.95rem;
            font-weight: 600; margin-bottom: 24px; transition: all 0.3s; box-shadow: var(--shadow-md);
        }
        .back-btn:hover { transform: translateX(-4px); box-shadow: var(--shadow-glow); }

        /* Photo Gallery */
        .photo-gallery { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; border-radius: 20px; overflow: hidden; margin-bottom: 24px; animation: fadeInUp 0.6s ease; }
        .photo-main { position: relative; height: 400px; overflow: hidden; cursor: pointer; }
        .photo-main img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .photo-main:hover img { transform: scale(1.05); }
        .photo-side { display: grid; grid-template-rows: 1fr 1fr; gap: 8px; }
        .photo-side-item { position: relative; height: 196px; overflow: hidden; cursor: pointer; }
        .photo-side-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .photo-side-item:hover img { transform: scale(1.05); }
        .photo-count {
            position: absolute; bottom: 12px; right: 12px;
            background: rgba(0,0,0,0.7); color: white; padding: 6px 14px;
            border-radius: 20px; font-size: 0.85rem; font-weight: 600;
        }

        /* Availability Badge */
        .avail-badge-detail {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 700;
            text-transform: uppercase; margin-bottom: 12px;
        }
        .avail-available { background: #dcfce7; color: #166534; }
        .avail-limited { background: #fef3c7; color: #92400e; }
        .avail-waitlist { background: #fee2e2; color: #991b1b; }

        .detail-content { margin-top: 30px; animation: fadeInUp 0.6s ease 0.2s both; }
        .detail-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
        .detail-header h1 { font-size: 1.8rem; font-weight: 800; color: #1e293b; }
        .detail-location { color: #64748b; font-size: 1rem; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
        .detail-location i { color: var(--primary); }
        .detail-meta { display: flex; align-items: center; gap: 30px; margin-bottom: 30px; flex-wrap: wrap; }
        .meta-item { display: flex; align-items: center; gap: 8px; }
        .stars-lg { color: #fbbf24; font-size: 1.3rem; }
        .rating-lg { font-size: 1.1rem; font-weight: 700; color: #333; }
        .price-lg { font-size: 1.6rem; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .price-lg span { font-size: 0.9rem; font-weight: 400; -webkit-text-fill-color: #94a3b8; }

        .detail-section {
            background: white; border-radius: 20px; padding: 28px; margin-bottom: 24px;
            box-shadow: var(--shadow-sm); transition: all 0.3s; animation: fadeInUp 0.6s ease both;
        }
        .detail-section:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .detail-section h2 {
            font-size: 1.2rem; font-weight: 700; color: #1e293b; margin-bottom: 18px;
            padding-bottom: 12px; border-bottom: 2px solid #f1f5f9;
            display: flex; align-items: center; gap: 10px;
        }
        .detail-section h2 i { color: var(--primary); }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; font-size: 0.95rem; }
        .detail-grid div { padding: 12px 16px; background: #f8fafc; border-radius: 12px; }
        .detail-grid strong { color: #475569; }
        .detail-grid a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .detail-grid a:hover { text-decoration: underline; }

        .amenities-list { display: flex; flex-wrap: wrap; gap: 10px; }
        .amenity-tag-lg { background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%); color: var(--primary); padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; transition: all 0.3s; }
        .amenity-tag-lg:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(99,102,241,0.2); }

        /* Pricing */
        .pricing-section { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); border: 1px solid #bae6fd; }
        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
        .pricing-card { background: white; border-radius: 14px; padding: 18px; text-align: center; transition: all 0.3s; border: 2px solid transparent; }
        .pricing-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .pricing-card.featured { border-color: var(--primary); background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%); }
        .pricing-icon { width: 44px; height: 44px; background: var(--gradient); border-radius: 10px; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
        .pricing-icon i { color: white; font-size: 1rem; }
        .pricing-card h3 { font-size: 0.85rem; color: #475569; margin-bottom: 6px; }
        .price-amount { font-size: 1.3rem; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 2px; }
        .price-note { font-size: 0.75rem; color: #94a3b8; }

        /* Map */
        #detailMap { height: 300px; border-radius: 16px; overflow: hidden; }

        /* Reviews */
        .reviews-summary { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; padding: 16px; background: #f8fafc; border-radius: 12px; }
        .reviews-avg { text-align: center; }
        .reviews-avg .big-rating { font-size: 2.5rem; font-weight: 800; color: #1e293b; }
        .reviews-avg .stars { font-size: 1rem; color: #fbbf24; }
        .reviews-avg .total { font-size: 0.85rem; color: #64748b; }
        .review-card { padding: 16px; background: #f8fafc; border-radius: 12px; margin-bottom: 12px; }
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .review-name { font-weight: 700; color: #1e293b; }
        .review-date { font-size: 0.8rem; color: #94a3b8; }
        .review-stars { color: #fbbf24; font-size: 0.85rem; margin-bottom: 6px; }
        .review-comment { font-size: 0.9rem; color: #475569; line-height: 1.5; }

        /* Food */
        .food-section { background: white; border-radius: 20px; padding: 28px; margin-bottom: 24px; box-shadow: var(--shadow-sm); }
        .food-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
        .food-card { background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%); border-radius: 14px; padding: 18px; border-left: 4px solid #22c55e; transition: all 0.3s; }
        .food-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(34,197,94,0.15); }
        .food-card h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; color: #1e293b; }
        .food-card ul { list-style: none; padding: 0; }
        .food-card li { font-size: 0.85rem; color: #475569; padding: 4px 0; border-bottom: 1px solid rgba(34,197,94,0.1); }
        .food-card li:last-child { border-bottom: none; }
        .food-card li::before { content: '•'; color: #22c55e; font-weight: bold; margin-right: 8px; }

        .rules-list { padding-left: 0; list-style: none; }
        .rules-list li { font-size: 0.95rem; color: #475569; padding: 10px 16px; background: #fef2f2; border-radius: 10px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .rules-list li::before { content: '\f00d'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: #ef4444; font-size: 0.85rem; }

        .nearby-list { display: flex; flex-wrap: wrap; gap: 10px; }
        .nearby-tag { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); color: #92400e; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; transition: all 0.3s; }
        .nearby-tag:hover { transform: scale(1.05); }

        /* Contact */
        .contact-section { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); border: 1px solid #bbf7d0; }
        .contact-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
        .contact-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px; background: white; border-radius: 14px; text-decoration: none; transition: all 0.3s; border: 2px solid transparent; }
        .contact-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .contact-card i { font-size: 1.6rem; margin-bottom: 2px; }
        .contact-card span { font-weight: 700; font-size: 0.9rem; color: #1e293b; }
        .contact-card small { font-size: 0.75rem; color: #64748b; }
        .contact-card.phone { border-color: #bfdbfe; }
        .contact-card.phone i { color: #3b82f6; }
        .contact-card.whatsapp { border-color: #bbf7d0; }
        .contact-card.whatsapp i { color: #22c55e; }
        .contact-card.email { border-color: #fde68a; }
        .contact-card.email i { color: #f59e0b; }
        .contact-card.booking { border-color: #e9d5ff; }
        .contact-card.booking i { color: #a855f7; }

        /* Inquiry Form */
        .inquiry-form { display: flex; flex-direction: column; gap: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: #475569; }
        .form-group input, .form-group select, .form-group textarea {
            padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px;
            font-size: 0.95rem; font-family: inherit; transition: all 0.3s; outline: none;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .btn-submit {
            padding: 14px 28px; background: var(--gradient); color: white; border: none;
            border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.4); }
        .form-success { background: #dcfce7; color: #166534; padding: 16px; border-radius: 12px; text-align: center; font-weight: 600; display: none; }

        .back-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 30px; color: var(--primary); text-decoration: none; font-weight: 600; font-size: 1rem; transition: all 0.3s; }
        .back-link:hover { transform: translateX(-4px); }
        .not-found { text-align: center; padding: 100px 20px; animation: fadeInUp 0.6s ease; }
        .not-found h2 { color: #475569; margin-bottom: 12px; font-size: 1.5rem; }
        .not-found p { color: #94a3b8; margin-bottom: 24px; }
        .not-found a { color: var(--primary); text-decoration: none; font-weight: 600; }

        @media (max-width: 768px) {
            .photo-gallery { grid-template-columns: 1fr; }
            .photo-main { height: 250px; }
            .photo-side { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
            .photo-side-item { height: 120px; }
            .detail-header { flex-direction: column; }
            .form-row { grid-template-columns: 1fr; }
            .pricing-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="detail-container">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to All PGs</a>
        <div id="pgDetail" class="pg-detail"></div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="pgdata.js"></script>
    <script src="detail.js"></script>
</body>
</html>
